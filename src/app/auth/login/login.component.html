<div class="background-color p-2 p-md-4 p-xl-5">
  <!-- Decorative background (design only) -->
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <span class="grid-overlay"></span>

  <div class="container login-wrap">
    <div class="row justify-content-center">
      <div class="col-12 col-xxl-11">
        <div class="card border-light-subtle shadow-sm login-card">
          <div class="row g-0">

            <!-- ============ Brand / Illustration panel ============ -->
            <div class="col-12 col-md-6 brand-panel">
              <div class="brand-top">
                <span class="brand-badge"><i class="fa fa-shield"></i></span>
                <span class="brand-name">Ohio Traffic Crash Reports</span>
              </div>

              <div class="illustration">
                <span class="glow-ring"></span>
                <img class="img-fluid" loading="lazy" src="assets/loginImage2.png" alt="">
              </div>

              <div class="brand-bottom">
                <h3>Crash reports, one search away.</h3>
                <p>Securely access, view and download official traffic crash reports.</p>
                <div class="chips">
                  <span class="chip"><i class="fa fa-lock"></i> Secure access</span>
                  <span class="chip"><i class="fa fa-bolt"></i> Instant reports</span>
                  <span class="chip"><i class="fa fa-file-text-o"></i> Easy download</span>
                </div>
              </div>
            </div>

            <!-- ============ Form panel ============ -->
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center form-panel">
              <div class="col-12 col-lg-11 col-xl-10">
                <div class="card-body p-3 p-md-4 p-xl-5 form-hover">
                  <div class="row">
                    <div class="col-12">
                      <div class="mb-5 title-block">
                        <h2 class="text-center heading">Login</h2>
                        <p class="sub-heading">Welcome back! Please sign in to continue.</p>
                      </div>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-12">
                    </div>
                    <form [formGroup]="loginForm">
                      <div class="row gy-3 overflow-hidden">
                        <div class="col-12">
                          <div class="form-floating mb-3 field">
                            <i class="fa fa-user field-icon"></i>
                            <input type="text" class="form-control" name="username" id="username" placeholder="Username"
                              formControlName="username" required>
                            <label for="username" class="form-label">Username</label>
                          </div>
                          <div class="form-error">
                            <div class="error-msg"
                              *ngIf="loginForm.controls['username'].errors && (!loginForm.controls['username'].pristine || isFormSubmitted)">
                              <div [hidden]="!loginForm.controls['username'].errors['required']">Enter Username</div>
                            </div>
                          </div>
                        </div>
                        <div class="col-12">
                          <div class="form-floating mb-3 field">
                            <i class="fa fa-lock field-icon"></i>
                            <input [type]="passwordHidden ? 'password' : 'text'" type="password" class="form-control"
                              name="password" id="password" value="" placeholder="Password" formControlName="password"
                              required>
                            <span class="toggle-password" (click)="togglePasswordVisibility()">
                              <i class="fa" [ngClass]="{'fa-eye-slash':!passwordHidden, 'fa-eye': passwordHidden}"></i>
                            </span>
                            <label for="password" class="form-label">Password</label>
                          </div>
                          <div class="form-error">
                            <div class="error-msg"
                              *ngIf="loginForm.controls['password'].errors && (!loginForm.controls['password'].pristine || isFormSubmitted)">
                              <div [hidden]="!loginForm.controls['password'].errors['required']">Enter Password</div>
                            </div>
                          </div>
                        </div>
                        <div class="col-12">
                          <div class="d-grid">
                            <button class="btn btn-primary btn-lg" type="submit" (click)="login()">Login</button>
                          </div>
                        </div>
                      </div>
                    </form>
                    <div class="row">
                      <div class="col-12">
                        <div class="divider"><span>or</span></div>
                        <div class="d-flex gap-2 gap-md-4 flex-column flex-md-row justify-content-md-center mt-4">
                          <a [routerLink]="['/admin']" href="#!" class="link">Police Department Login</a>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
