<div style="background-color: #f0f0f0">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <!-- Image Section -->
          <div class="mb-4">
            <img [src]="policeImageUrl" alt="TrafficPoliceReport" class="img-fluid" *ngIf="policeImageUrl">
          </div>
          
          <!-- Login Form Section -->
          <div class="w-100">
            <div class="login-container">
              <form action="#!" class="d-flex flex-column align-items-end">
                <div class="col-lg-4 text-center mb-3">
                  <h2 class="heading">Login</h2>
                </div>
                <div class="form-floating mb-3 w-75">
                  <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" required>
                  <label for="email" class="form-label">Email</label>
                </div>
                <div class="form-floating mb-3 w-75">
                  <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                  <label for="password" class="form-label">Password</label>
                </div>
                <div class="form-floating mb-3 d-grid w-75">
                  <button class="btn btn-lg" type="submit" (click)="onSubmit()">Login</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
