<div style="background-color: #f0f0f0; min-height: 100vh; display: flex; align-items: flex-end; justify-content: flex-end;">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <!-- Image Section -->
        <div class="mb-4 text-center">
          <img [src]="policeImageUrl" alt="TrafficPoliceReport" class="img-fluid" *ngIf="policeImageUrl">
        </div>
        <!-- Login Section -->
        <div class="col-12 d-flex justify-content-end">
          <div class="col-12 col-md-6 d-flex align-items-end justify-content-end">
            <div class="col-12 col-lg-11 col-xl-10">
              <div class="card-body p-3 p-md-4 p-xl-5 form-hover">
                <div class="row">
                  <div class="col-12">
                    <div class="mb-5">
                      <h2 class="text-center heading">Login</h2>
                    </div>
                  </div>
                </div>
                <form [formGroup]="loginForm">
                  <div class="row gy-3 overflow-hidden">
                    <div class="col-12">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" name="username" id="username" placeholder="Username" formControlName="username" required>
                        <label for="username" class="form-label">Username</label>
                      </div>
                      <div class="form-error">
                        <div class="error-msg" *ngIf="loginForm.controls['username'].errors && (!loginForm.controls['username'].pristine || isFormSubmitted)">
                          <div *ngIf="loginForm.controls['username'].errors['required']">Enter Username</div>
                        </div>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="form-floating mb-3 position-relative">
                        <input [type]="!passwordHidden ? 'password' : 'text'" class="form-control" name="password" id="password" placeholder="Password" formControlName="password" required>
                        <label for="password" class="form-label">Password</label>
                        <span class="toggle-password position-absolute" (click)="togglePasswordVisibility()">
                          <i class="fa" [ngClass]="{'fa-eye-slash':!passwordHidden, 'fa-eye': passwordHidden}"></i>
                        </span>
                      </div>
                      <div class="form-error">
                        <div class="error-msg" *ngIf="loginForm.controls['password'].errors && (!loginForm.controls['password'].pristine || isFormSubmitted)">
                          <div *ngIf="loginForm.controls['password'].errors['required']">Enter Password</div>
                        </div>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="d-grid">
                        <button class="btn btn-primary btn-lg" type="submit" (click)="login()">Login</button>
                      </div>
                    </div>
                  </div>
                </form>
                <div class="row">
                  <div class="col-12">
                    <div class="d-flex gap-2 gap-md-4 flex-column flex-md-row justify-content-md-center mt-5">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
