<div style="background-color: #f0f0f0">
    <div class="container">
        <div>
          <img src="assets/images/policeman.jpg" alt="TrafficPoliceReport" class="img-container">
        </div>
        <section class="section">
        <div class="container search-form min-content-container">
          <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center">
              <h4 class="mb-0">Police Departments</h4>
              <a class="btn btn-default d-flex align-items-center" href="#">
                <i class="fa fa-reply mr-2"></i> Back to search
              </a>
            </div>
            <hr class="my-4">
          </div>
          <div class="col-md-12">
            <form class="row" [formGroup]="policeDepartmentForm" (ngSubmit)="onSubmit()">
              <div class="col-md-4 d-flex align-items-center">
                <label for="departmentSelect">Select Your Police Department:</label>
              </div>
              <div class="col-md-5">
                <select id="departmentSelect" class="form-control" formControlName="police_department_id">
                  <option value="">Department</option>
                  <option *ngFor="let department of departmentList" [value]="department?.department_id">
                    {{ department?.name }}
                  </option>
                </select>
              </div>
              <div class="col-md-3 d-flex align-items-center">
                <button type="submit" class="btn btn-default">Go!</button>
              </div>
            </form>
          </div>
        </div>
    </section>
      </div>
    </div>
