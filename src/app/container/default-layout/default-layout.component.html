<div id="wrapper">
  <!-- Top Header Starts -->
  <div id="navbar-wrapper" class="crm-top-navbar">
    <nav class="navbar navbar-expand">
      <div class="container-fluid px-3 px-md-4">
        <div class="navbar-header d-flex align-items-center">
          <button type="button" class="btn btn-icon sidebar-toggle-btn me-3" id="sidebar-toggle"
            aria-label="Toggle Navigation">
            <i class="fa fa-bars"></i>
          </button>
          <h2 class="navbar-brand header mb-0 d-flex align-items-center">
            <span class="brand-badge"><i class="fa fa-shield-alt"></i></span>
            <span class="brand-title ms-2">CRASH REPORT</span>
            <span class="badge bg-brand-subtle ms-2 d-none d-sm-inline-block">CRM PRO</span>
          </h2>
        </div>
        <div class="dropdown">
          <a class="nav-link dropdown-toggle username user-profile-chip" href="#" id="navbarDropdown" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <div class="user-avatar">
              <i class="fas fa-user-circle"></i>
            </div>
            <span class="user-name ms-2">{{username | titlecase}}</span>
            <i class="fa fa-chevron-down ms-1 dropdown-arrow"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="navbarDropdown">
            <li class="dropdown-header text-muted text-uppercase px-3 py-1 font-size-xs">Account</li>
            <li>
              <a class="dropdown-item" [routerLink]="['change-password']">
                <i class="fa fa-key me-2 text-brand"></i>Change Password
              </a>
            </li>
            <li>
              <hr class="dropdown-divider my-1">
            </li>
            <li>
              <a class="dropdown-item text-danger" [routerLink]="['/auth/login']">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
  <!-- Top Header Ends -->

  <!-- Sidebar Overlay for Mobile -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Sidebar Starts -->
  <aside id="sidebar-wrapper" class="crm-sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo-container">
        <div class="brand-symbol">
          <i class="fa fa-car-crash"></i>
        </div>
        <div class="brand-meta">
          <h2 class="brand-text">CRO CRM</h2>
          <span class="brand-sub">Incident Portal</span>
        </div>
      </div>
    </div>
    <ul class="sidebar-nav">
      <li *ngFor="let menu of navItems" (click)="activeUrl(menu.url)" [ngClass]="{'active': menu.url == active}"
        class="nav-item">
        <a [routerLink]="[menu.url]" class="nav-link-custom">
          <span class="nav-icon-wrapper">
            <i class="{{menu.icon}}" [ngStyle]="menu.style"></i>
          </span>
          <span class="nav-label">{{menu.name}}</span>
        </a>
      </li>
    </ul>
  </aside>

  <section id="content-wrapper" class="crm-main-content">
    <div class="container-fluid content-container">
      <div class="row">
        <div class="col-lg-12">
          <app-common-layout />
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <section class="footer-wrapper">
    <footer class="d-flex justify-content-center align-items-center py-2 px-3">
      <small class="p-0 mb-0 footerText">
        © Deemsys INC {{currentYear}} · All Rights Reserved
      </small>
    </footer>
  </section>
  <!-- Footer -->
</div>
