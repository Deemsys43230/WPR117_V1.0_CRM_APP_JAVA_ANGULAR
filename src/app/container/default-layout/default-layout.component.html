<!-- Top Header Starts -->
<div id="navbar-wrapper">
  <nav class="navbar">
    <div class="container-fluid">
      <div class="navbar-header">
        <h2 class="navbar-brand header" id="sidebar-toggle"><i class="fa fa-bars"></i>&nbsp; &nbsp;CRASH REPORT</h2>
      </div>
      <div class="dropdown">
        <a class="nav-link dropdown-toggle username" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown"
          aria-expanded="false"><i class="fas fa-user"></i>
          {{username | titlecase}}
        </a>
        <ul class="dropdown-menu dropdown-menu-end p-0" aria-labelledby="navbarDropdown">
          <li><a class="dropdown-item" [routerLink]="['change-password']"><i class="fa fa-key me-1"></i>Change
              Password</a></li>
          <li><a class="dropdown-item" [routerLink]="['/auth/login']"> <i class="fas fa-sign-out-alt"></i> Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>
<!-- Top Header Ends -->


<div id="wrapper">
  <!-- Sidebar Starts -->
  <aside id="sidebar-wrapper">
    <div class="sidebar-brand">
      <h2>Logo</h2>
    </div>
    <ul class="sidebar-nav">
      <li *ngFor="let menu of navItems" (click)="activeUrl(menu.url)" [ngClass]="{'active': menu.url == active}">
        <a [routerLink]="[menu.url]"><i class="{{menu.icon}}"></i>{{menu.name}}</a>
      </li>
    </ul>
  </aside>

  <section id="content-wrapper">
    <div class="row">
      <div class="col-lg-12">
        <app-common-layout />
      </div>
    </div>
  </section>
</div>

<!-- Footer -->
<section class="footer-wrapper">
  <footer class="d-flex justify-content-center">
    <small class=" p-0 mb-0 text-light fw-bold footerText">© Deemsys INC {{currentYear}} · All Rights
        Reserved</small>
</footer>
</section>
  <!-- Footer -->
