<div class="card-header h5">
  <div class="custom-row mb-2">
    <div class="headerStyle">
      Change Password
    </div>
  </div>
</div>

<!-- Form starts -->
<div class="card-body">
  <form class="d-flex justify-content-center align-items-center w-100" [formGroup]="changePasswordForm">
    <div class="col-lg-8 col-md-10 col-sm-12 d-flex flex-column align-items-center">

      <div class="mb-3 w-50">
        <label for="" class="form-label">Current Password:<span class="text-danger">*</span></label>
        <div class="input-box">
          <input type="password" class="form-control" placeholder="Enter Current Password"
            formControlName="current_password" />
        </div>
        <div class="error-msg-area">
          <div *ngIf="
            changePasswordForm.controls['current_password'].errors &&
                (!changePasswordForm.controls['current_password'].pristine ||
                isChangePasswordFormSubmitted)" class="text-danger">
            <div [hidden]="!changePasswordForm.controls['current_password'].errors?.['required']">
              Please Enter Current Password
            </div>
          </div>
        </div>
      </div>

      <div class="mb-3 w-50">
        <label for="" class="form-label">New Password:<span class="text-danger">*</span></label>
        <div class="input-box">
          <input type="password" class="form-control" placeholder="Enter New Password" formControlName="new_password" />
        </div>
        <div class="error-msg-area">
          <div *ngIf="
            changePasswordForm.controls['new_password'].errors &&
                (!changePasswordForm.controls['new_password'].pristine ||
                isChangePasswordFormSubmitted)" class="text-danger">
            <div [hidden]="!changePasswordForm.controls['new_password'].errors?.['required']">
              Please Enter New Password
            </div>
          </div>
        </div>
      </div>

      <div class="mb-3 w-50">
        <label for="" class="form-label">Confirm New Password:<span class="text-danger">*</span></label>
        <div class="input-box">
          <input type="password" class="form-control" placeholder="Confirm New Password"
            formControlName="confirm_new_password" />
        </div>
        <div class="error-msg-area">
          <div *ngIf="
            changePasswordForm.controls['confirm_new_password'].errors &&
                (!changePasswordForm.controls['confirm_new_password'].pristine ||
                isChangePasswordFormSubmitted)" class="text-danger">
            <div [hidden]="!changePasswordForm.controls['confirm_new_password'].errors?.['required']">
              Please Confirm New Password
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end w-50 gap-3">
        <button (click)="back()" class="btn common-btn-css common-btn-color2 btn-sm" type="button">
          Cancel
        </button>
        <button (click)="onSubmit()" class="btn common-btn-css common-btn-color btn-sm" type="submit">
          Change Password
        </button>
      </div>

    </div>
  </form>
</div>
<!-- Form ends -->
