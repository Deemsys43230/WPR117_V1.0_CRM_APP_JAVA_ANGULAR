<!-- Header starts -->
<div class="card-header h5">
  <div class="custom-row">
    <div class="headerStyle">
      <i class="fa fa-phone custom-icon"></i>
      Add Police Department
    </div>
    <div class="col-md-2 col-lg-2">
      <button
        (click)="back()"
        class="btn-back btn add-back-btn text-white"
        data-bs-toggle="modal"
        data-bs-target="#memberModal"
      >
        <i class="fa fa-reply"></i>&nbsp;<b>Back</b>
      </button>
    </div>
  </div>
</div>
<!-- Header ends -->

<!-- Form starts -->
<div class="card-body">
  <form class="d-flex flex-column gap-3">
    <div class="row">
      <div class="input-col">
        <label for="" class="form-label"

        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"

              fill="currentColor"
              class="bi bi-globe-asia-australia"
              viewBox="0 0 16 16"
            >

              />

              />

          </span>
          <select class="form-control w-50">
            <option value="">---select---</option>
            <option value="India">India</option>
            <option value="SA">SA</option>
            <option value="Aus">Aus</option>
          </select>
        </div>
      </div>

      <div class="input-col">
        <label for="" class="form-label"
          >Name<span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-person-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
              />
            </svg>
          </span>
          <input type="text" class="form-control w-50" placeholder="Name" />
        </div>
      </div>

      <div class="input-col">
        <label for="" class="form-label"
          >Code<span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-code"
              viewBox="0 0 16 16"
            >
              <path
                d="M5.854 4.854a.5.5 0 1 0-.708-.708l-3.5 3.5a.5.5 0 0 0 0 .708l3.5 3.5a.5.5 0 0 0 .708-.708L2.707 8zm4.292 0a.5.5 0 0 1 .708-.708l3.5 3.5a.5.5 0 0 1 0 .708l-3.5 3.5a.5.5 0 0 1-.708-.708L13.293 8z"
              />
            </svg>
          </span>
          <input type="text" class="form-control w-50" placeholder="Code" />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="input-col">
        <label for="" class="form-label"
          >Login Link<span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-bag-check"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M10.854 8.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 0 1 .708-.708L7.5 10.793l2.646-2.647a.5.5 0 0 1 .708 0"
              />
              <path
                d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"
              />
            </svg>
          </span>
          <input
            type="text"
            class="form-control w-50"
            placeholder="Login Url"
          />
        </div>
      </div>

      <div class="input-col">
        <label for="" class="form-label"
          >Search Link<span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-globe"
              viewBox="0 0 16 16"
            >
              <path
                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.204-1.335.82-1.887 1.855A8 8 0 0 0 5.145 4H7.5zM4.09 4a9.3 9.3 0 0 1 .64-1.539 7 7 0 0 1 .597-.933A7.03 7.03 0 0 0 2.255 4zm-.582 3.5c.03-.877.138-1.718.312-2.5H1.674a7 7 0 0 0-.656 2.5zM4.847 5a12.5 12.5 0 0 0-.338 2.5H7.5V5zM8.5 5v2.5h2.99a12.5 12.5 0 0 0-.337-2.5zM4.51 8.5a12.5 12.5 0 0 0 .337 2.5H7.5V8.5zm3.99 0V11h2.653c.187-.765.306-1.608.338-2.5zM5.145 12q.208.58.468 1.068c.552 1.035 1.218 1.65 1.887 1.855V12zm.182 2.472a7 7 0 0 1-.597-.933A9.3 9.3 0 0 1 4.09 12H2.255a7 7 0 0 0 3.072 2.472M3.82 11a13.7 13.7 0 0 1-.312-2.5h-2.49c.062.89.291 1.733.656 2.5zm6.853 3.472A7 7 0 0 0 13.745 12H11.91a9.3 9.3 0 0 1-.64 1.539 7 7 0 0 1-.597.933M8.5 12v2.923c.67-.204 1.335-.82 1.887-1.855q.26-.487.468-1.068zm3.68-1h2.146c.365-.767.594-1.61.656-2.5h-2.49a13.7 13.7 0 0 1-.312 2.5m2.802-3.5a7 7 0 0 0-.656-2.5H12.18c.174.782.282 1.623.312 2.5zM11.27 2.461c.247.464.462.98.64 1.539h1.835a7 7 0 0 0-3.072-2.472c.218.284.418.598.597.933M10.855 4a8 8 0 0 0-.468-1.068C9.835 1.897 9.17 1.282 8.5 1.077V4z"
              />
            </svg>
          </span>
          <input
            type="text"
            class="form-control w-50"
            placeholder="Search Url"
          />
        </div>
      </div>
      <div class="input-col">
        <label for="" class="form-label">Upload File</label>
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-cloud-arrow-up"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708z"
              />
              <path
                d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"
              />
            </svg>
          </span>
          <!-- <div class="col-3">
              <img class="w-100" [src]="supportingImage ? supportingImage : 'assets/placeholder-image-icon-0.jpg'"/>
            </div> -->
          <input
            class="w-100"
            type="file"
            accept="image/*"
            placeholder="Supporting"
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="text-end">
        <button class="btn common-btn-css common-btn-color" type="submit">
          Submit
        </button>
      </div>
    </div>
  </form>
</div>
<!-- Form ends -->
