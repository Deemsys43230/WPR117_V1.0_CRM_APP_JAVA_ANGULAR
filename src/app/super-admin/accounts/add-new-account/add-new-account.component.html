<!-- Header starts -->
<div class="card-header h5">
  <div class="custom-row">
    <div class="headerStyle">
      <i class="fa fa-phone custom-icon"></i>
      Add New Account
    </div>
    <div class="col-md-2 col-lg-2 text-end">
      <button
        (click)="back()"
        class="btn-back btn add-back-btn text-white"
        data-bs-toggle="modal"
        data-bs-target="#memberModal"
      >
        <i class="fa fa-reply"></i>&nbsp;<b>Back</b>
      </button>
    </div>
  </div>
</div>
<!-- Header ends -->

<!-- Form starts -->
<div class="card-body">
  <form class="d-flex flex-column gap-3">
    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >First Name <span class="text-danger">*</span></label>
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-user"></i>
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="First Name"
          />
        </div>
      </div>

      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >Middle Name</label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-user"></i>
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="Middle Name"
          />
        </div>
      </div>

      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >Last Name <span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-user"></i>
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="Last Name"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >User Name <span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-user"></i>
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="User Name"
          />
        </div>
      </div>

      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >Email Id <span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-envelope"></i>
          </span>
          <input type="text" class="form-control" placeholder="Email Id" />
        </div>
      </div>

      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >Phone Number <span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-phone"></i>
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="Phone Number"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >Role <span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-user-secret"></i>
          </span>
          <select class="form-control">
            <option value="">---select---</option>
            <option value="India">Admin</option>
            <option value="SA">User</option>
          </select>
        </div>
      </div>
      <div class="col-lg-4 col-md-4 col-sm-12">
        <label for="" class="form-label"
          >Department <span class="text-danger">*</span></label
        >
        <div class="input-box">
          <span class="input-group-text" id="basic-addon1">
            <i class="fa fa-id-badge"></i>
          </span>
          <select class="form-control">
            <option value="">---select---</option>
            <option value="India">Boardman</option>
            <option value="SA">Fairbom</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="text-end">
        <button class="btn common-btn-css common-btn-color" type="submit">
          Submit
        </button>
      </div>
    </div>
  </form>
</div>
<!-- Form ends -->
