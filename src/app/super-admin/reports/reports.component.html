<!-- Header Starts -->
<div class="card-header h5 mb-3">
    <div class="custom-row">
        <div class="headerStyle">
            <i class="fa fa-file custom-icon"></i>
            Reports
        </div>
    </div>
</div>
<!-- Header Ends -->

<!-- Search form Starts -->
<div class="row">
    <form class="row" [formGroup]="searchReportsForm">

        <div class="col-lg-4 col-md-4 col-sm-12 custom-margin">
            <div> 
            <label for="crashDate" class="form-label">Crash Date</label></div>
            <div class="input-group">
                <input type="text" id="crashDate" class="form-control" formControlName="crashDate" bsDatepicker
                    [bsConfig]="{ dateInputFormat: 'MM/DD/YYYY' }" placeholder="MM/DD/YYYY" [maxDate]="today"
                    #datepicker="bsDatepicker" readonly (keydown)="$event.preventDefault()" />
                <span class="input-group-text" (click)="openDatePicker(datepicker)">
                    <i class="fa fa-calendar"></i> <!-- Calendar Icon -->
                </span>
            </div>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 custom-margin">
            <label for="" class="form-label">Report Number</label>
            <input type="text" class="form-control" placeholder="Search Report Number" formControlName="reportNumber" />
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 custom-margin">
            <label for="" class="form-label">Location</label>
            <input type="text" class="form-control" placeholder="Search Location" formControlName="location" />
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 custom-margin custom-select-wrapper">
            <label for="" class="form-label">Police Department</label>
            <select class="form-control" formControlName="policeDepartmentId">
                <option value="">-Select-</option>
                <option *ngFor="let police of departmentList" value="{{police?.department_id}}">
                    {{police?.name}}
                </option>
            </select>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 custom-margin custom-select-wrapper">
            <label for="" class="form-label">County</label>
            <select class="form-control" formControlName="countyId">
                <option value="">-Select-</option>
                <option *ngFor="let county of countyList" value="{{county?.county_id}}">
                    {{county?.county_name}}
                </option>
            </select>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 custom-margin">
        <div> 
            <label for="addedOnFromDate" class="form-label">Added On From Date</label></div>
            <div class="input-group">
                <input type="text" id="addedOnFromDate" class="form-control" formControlName="addedOnFromDate"
                    [maxDate]="today" bsDatepicker [bsConfig]="{ dateInputFormat: 'MM/DD/YYYY' }"
                    placeholder="MM/DD/YYYY" #datepickerForFrom="bsDatepicker" (bsValueChange)="onDateInput($event)"
                    readonly (keydown)="$event.preventDefault()" />
                <span class="input-group-text" (click)="openDatePicker(datepickerForFrom)">
                    <i class="fa fa-calendar"></i> <!-- Calendar Icon -->
                </span>
                <!-- Error message for From Date -->
                <div *ngIf="isFromDateError" class="text-danger">Please select From date</div>
            </div>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 custom-margin">
            <div> 
            <label for="addedOnToDate" class="form-label">Added On To Date</label></div>
            <div class="input-group">
                <input type="text" id="addedOnToDate" class="form-control" formControlName="addedOnToDate"
                    [maxDate]="today" [minDate]="minimumDate" bsDatepicker
                    [bsConfig]="{ dateInputFormat: 'MM/DD/YYYY' }" placeholder="MM/DD/YYYY"
                    (bsValueChange)="onDateInputTo($event)" #datepickerForTo="bsDatepicker" [bsValue]="bsToDate"
                    readonly (keydown)="$event.preventDefault()" />
                <span class=" input-group-text" (click)="openDatePicker(datepickerForTo)">
                    <i class="fa fa-calendar"></i> <!-- Calendar Icon -->
                </span>
                <!-- Error message for To Date -->
                <div *ngIf="isToDateError" class="text-danger">Please select To date</div>
            </div>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12">
            <div class="btn-box">
                <button
                    class="px-3 py-2 d-flex justify-content-center align-items-center search-btn  border-0 text-white"
                    type="submit" (click)="onSearch()" title="Search"><i class="fa-solid fa-magnifying-glass"
                        aria-hidden="true"></i></button>
                <button
                    class="px-3 py-2 d-flex justify-content-center align-items-center reset-btn  border-0 text-white"
                    type="submit" (click)="resetSearch()" title="Reset"><i class="fa-solid fa-arrows-rotate"
                        aria-hidden="true"></i></button>
            </div>
        </div>

    </form>
</div>
<!-- Search form ends -->

<!-- Table Starts -->
<table-config *ngIf="callChildComponent" [tableData]="table_data" (page)="page($event)" [search]="searchValue"
    (actionOutput)="actionOutput($event)"></table-config>
<!-- Table Ends -->
