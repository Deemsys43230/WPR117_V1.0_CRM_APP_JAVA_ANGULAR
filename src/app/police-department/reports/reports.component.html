<div style="background-color: #f0f0f0">
    <div class="container">
        <!-- Image Section -->
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="mb-4">
                    <img [src]="policeImageUrl" alt="TrafficPoliceReport" class="img-fluid" *ngIf="policeImageUrl">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="row mb-3">
            <div class="col-md-12 text-right">
                <button class="btn btn-secondary ml-2">
                    <i class="fa fa-eye"></i> My Department
                </button>
                <button class="btn btn-secondary ml-2">
                    <i class="fa fa-key"></i> Change Password
                </button>
                <button class="btn btn-secondary ml-2">
                    <i class="fa fa-sign-out"></i> Logout                    
                </button>
            </div>
        </div>

        <!-- Reports Form -->
        <div class="row">
            <div class="col-md-12">
                <h3 class="mb-4">Reports</h3>
                <button class="btn btn-primary float-right">
                    <i class="fa fa-plus"></i> Add New Report
                </button>
                <form [formGroup]="policeDepartmentForm" class="row">
                    <!-- Form Controls -->
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <label for="crashDate" class="form-label">Crash Date:</label>
                        <input type="date" id="crashDate" class="form-control" formControlName="crashDate" />
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <label for="reportNumber" class="form-label">Report Number:</label>
                        <input type="text" id="reportNumber" class="form-control" placeholder="Search Report Number"
                            formControlName="reportNumber" />
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <label for="firstName" class="form-label">First Name:</label>
                        <input type="text" id="firstName" class="form-control" placeholder="Search First Name"
                            formControlName="firstName" />
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <label for="lastName" class="form-label">Last Name:</label>
                        <input type="text" id="lastName" class="form-control" placeholder="Search Last Name"
                            formControlName="lastName" />
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <label for="location" class="form-label">Location:</label>
                        <input type="text" id="location" class="form-control" placeholder="Search Location"
                            formControlName="location" />
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <label for="addedOnFromDate" class="form-label">Added On From Date:</label>
                        <input type="date" id="addedOnFromDate" class="form-control" formControlName="addedOnFromDate" />
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <label for="addedOnToDate" class="form-label">Added On To Date:</label>
                        <input type="date" id="addedOnToDate" class="form-control" formControlName="addedOnToDate" />
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-12 custom-margin">
                        <div class="d-flex">
                            <button class="btn btn-success mr-2" type="submit" (click)="onSearch()">
                                <i class="fa-solid fa-magnifying-glass"></i> 
                            </button>
                            <button class="btn btn-danger" type="button" (click)="resetSearch()">
                                <i class="fa-solid fa-arrows-rotate"></i> 
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
