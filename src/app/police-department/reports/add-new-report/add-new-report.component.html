<div style="background-color: #f0f0f0">
<div class="container">
    <!-- Image Section -->
    <div class="row">
        <div class="col-lg-12 text-center">
            <div class="mb-4">
                <img [src]="policeImageUrl" alt="TrafficPoliceReport" class="img-fluid">
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="row mb-3">
        <div class="col-md-12 text-right">
            <button class="btn btn-secondary ml-2">
                <i class="fa fa-eye"></i> My Department
            </button>
            <button class="btn btn-secondary ml-2">
                <i class="fa fa-key"></i> Change Password
            </button>
            <button class="btn btn-secondary ml-2">
                <i class="fa fa-sign-out"></i> Logout
            </button>
        </div>
    </div>

    <!-- Add New Report Form -->
    <div class="row">
        <div class="col-lg-12 d-flex justify-content-between align-items-center mb-3">
            <h1>Add Report</h1>
            <button (click)="backToReportList()" class='outer-div'><i class="fa fa-reply"></i> Back to Reports list</button>
        </div>
    </div>
    
    <div class="container">
        <form class="row ml-5" [formGroup]="addNewReportForm">
          <div class="row mb-2">
            <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
              <label class="form-label">Upload Report:</label>
              <input class="form-control" type="file" formControlName="uploadReport" accept=".pdf" (change)="onFileChange($event)">
            </div>
            <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
              <label class="form-label">Country:</label>
              <select class="form-control" formControlName="country">
                <option value="" disabled selected>Select</option>
                <option *ngFor="let country of countries" [value]="country.value">
                  {{ country.value }} - {{ country.label }}
                </option>
              </select>
            </div>
            <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
              <label class="form-label">Crash Date:</label>
              <input type="date" class="form-control" placeholder="Enter Crash Date" formControlName="crashDate" />
            </div>
            <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
              <label class="form-label">Report Number:</label>
              <input type="text" class="form-control" placeholder="Enter Report Number" formControlName="reportNumber" />
            </div>
            <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
              <label class="form-label">Location:</label>
              <input type="text" class="form-control" placeholder="Enter Location" formControlName="location" />
            </div>
            <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
              <label class="form-label">Crash Severity:</label>
              <select class="form-control" formControlName="crashSeverity">
                <option value="" disabled selected>Select</option>
                <option *ngFor="let severity of crashSeverityOptions" [value]="severity.value">
                  {{ severity.label }}
                </option>
              </select>
            </div>
      
            <h2 style="text-decoration: underline;">Occupants</h2>
            <div formArrayName="occupants">
              <div *ngFor="let occupant of occupants.controls; let i = index" [formGroupName]="i">
                <div class="row mb-2">
                  <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
                    <label class="form-label">First Name:</label>
                    <input type="text" class="form-control" placeholder="Enter First Name" formControlName="first_name" />
                  </div>
                  <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
                    <label class="form-label">Last Name:</label>
                    <input type="text" class="form-control" placeholder="Enter Last Name" formControlName="last_name" />
                  </div>
                  <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
                    <label class="form-label">Injuries:</label>
                    <select class="form-control" formControlName="injuries">
                      <option value="" disabled>Select</option>
                      <option *ngFor="let injury of injuries" [value]="injury.value">{{ injury.label }}</option>
                    </select>
                  </div>
                  <div class="col-lg-6 col-md-4 col-sm-12 custom-margin">
                    <label class="form-label">Seating Position:</label>
                    <select class="form-control" formControlName="seating_position">
                      <option value="" disabled>Select</option>
                      <option *ngFor="let position of seatingPosition" [value]="position.value">{{ position.label }}</option>
                    </select>
                  </div>
                  <div class="col-lg-10"></div>
                  <div class="col-lg-2 mt-2">
                    <button *ngIf="occupants.length > 1" type="button" class="btn btn-danger" (click)="removeOccupant(i)">
                      <i class="fa fa-minus"></i> Remove
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-12">
              <a style="font-size: 14px; cursor: pointer;" (click)="addOneMoreOccupant()">
                <i class="fa fa-plus"></i> Add One More Occupant
              </a>
            </div>
            <div class="row text-end">
              <div>
                <button (click)="onSubmit()" class="btn common-btn-css common-btn-color mr-3" type="submit">
                  Submit
                </button>
                <button (click)="onCancel()" class="btn common-btn-css common-btn-color" type="button">
                  Cancel
                </button>
              </div>
            </div>              
          </div>
        </form>
      </div>
