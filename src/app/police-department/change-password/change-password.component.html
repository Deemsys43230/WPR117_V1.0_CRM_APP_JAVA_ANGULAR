<div style="background-color: #f0f0f0">
    <app-police-department-header/>

  <!-- View Deparment -->   
  <div class=" container">
    <div class="header-section d-flex justify-content-between align-items-center mb-3 white-form">
        <h1>Change Password</h1>
        <button (click)="backToReportList()" class="outer-div">
            <i class="fa fa-reply"></i> Back to Reports list
        </button>
    </div>

    <div class="ml-5">
        <form [formGroup]="changePasswordForm" class="row">
        <div class="row mb-3">
            <div class="col-md-3">
                <label><strong>Current Password:</strong></label>
            </div>
            <div class="col-md-3">
                <input type="password" class="form-control" formControlName="current_password" placeholder="Enter Current Password" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-3">
                <label><strong>New Password:</strong></label>
            </div>
            <div class="col-md-3">
                <input type="password" class="form-control" formControlName="new_password" placeholder="Enter New Password" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-3">
                <label><strong>Confirm New Password:</strong></label>
            </div>
            <div class="col-md-3">
                <input type="password" class="form-control" formControlName="confirm_new_password" placeholder="Enter Confirm New Password" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-2">
            </div>
            <div class="col-md-3 mb-5">
                <button type="button" class="btn btn-change" (click)="changePassword()">Change</button>
                <button type="button" class="btn ml-2" (click)="cancel()">Cancel</button>
            </div>
        </div>
    </form>
    </div>
</div>
