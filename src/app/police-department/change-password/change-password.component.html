<div class="page-bg police-layout-page">
  <app-police-department-header />

  <div class="container police-content-container outer-div">
    <div class="row justify-content-center">
      <div class="col-xl-7 col-lg-8 col-md-10 col-12">

        <!-- Header Section (neatly aligned with card) -->
        <div class="page-header d-flex justify-content-between align-items-center my-4 flex-wrap gap-3">
          <div class="title-wrap d-flex align-items-center gap-3">
            <span class="title-icon">
              <i class="fa fa-key"></i>
            </span>
            <div>
              <h3 class="highlighted-header mb-0">Change Password</h3>
              <p class="page-sub mb-0 text-muted">Update your department portal access credentials.</p>
            </div>
          </div>
          <button class="btn back-btn" (click)="backToReportList()">
            <i class="fa fa-reply me-1"></i> Back to Reports list
          </button>
        </div>

        <!-- Password Card -->
        <div class="card shadow-sm border-0 password-card">
          <div class="card-body p-4 p-md-5">
            <form [formGroup]="changePasswordForm" class="password-form">

              <!-- Current Password -->
              <div class="mb-4 form-group-row">
                <label class="form-label fw-semibold">
                  Current Password <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-lock"></i></span>
                  <input type="password" class="form-control" formControlName="current_password"
                    placeholder="Enter Current Password" />
                </div>
                <div class="error-msg-area">
                  <div *ngIf="
                    changePasswordForm.controls['current_password']?.errors &&
                    (changePasswordForm.controls['current_password']?.touched || isPasswordChanged)
                  " class="error-msg text-danger mt-1">
                    <span [hidden]="!changePasswordForm.controls['current_password']?.errors?.['required']">
                      Current Password is required.
                    </span>
                  </div>
                </div>
              </div>

              <!-- New Password -->
              <div class="mb-4 form-group-row">
                <label class="form-label fw-semibold">
                  New Password <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-key"></i></span>
                  <input type="password" class="form-control" formControlName="new_password"
                    placeholder="Enter New Password" />
                </div>
                <div class="error-msg-area">
                  <div *ngIf="
                    changePasswordForm.controls['new_password']?.errors &&
                    (changePasswordForm.controls['new_password']?.touched || isPasswordChanged)
                  " class="error-msg text-danger mt-1">
                    <span [hidden]="!changePasswordForm.controls['new_password']?.errors?.['required']">
                      New Password is required.
                    </span>
                  </div>
                </div>
              </div>

              <!-- Confirm New Password -->
              <div class="mb-4 form-group-row">
                <label class="form-label fw-semibold">
                  Confirm New Password <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-check-circle"></i></span>
                  <input type="password" class="form-control" formControlName="confirm_new_password"
                    placeholder="Enter Confirm New Password" />
                </div>
                <div class="error-msg-area">
                  <div *ngIf="
                    changePasswordForm.controls['confirm_new_password']?.errors &&
                    (changePasswordForm.controls['confirm_new_password']?.touched || isPasswordChanged)
                  " class="error-msg text-danger mt-1">
                    <span [hidden]="!changePasswordForm.controls['confirm_new_password']?.errors?.['required']">
                      Confirm New Password is required.
                    </span>
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                <button type="button" class="btn btn-outline-secondary px-4" (click)="cancel()">Cancel</button>
                <button type="button" class="btn btn-primary common-btn-color btn-change px-4"
                  (click)="changePassword()">
                  <i class="fa fa-save me-1"></i> Change Password
                </button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
