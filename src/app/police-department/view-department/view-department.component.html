<div style="background-color: #f0f0f0">
  <app-police-department-header/>

        <!-- View Deparment -->
        <div class="container">
            <div class="header-section d-flex justify-content-between align-items-center mb-3">
                <h3 class="highlighted-header">My Department</h3>
                <button (click)="backToReportList()" class="btn">
                    <i class="fa fa-reply"></i> Back to Reports list
                </button>
            </div>
        <div class="row">
            <div class="col-lg-3"></div>
            <div class="table-wrapper box-style col-lg-7">
                <div class="table-row">
                    <div class="table-cell"><strong>County:</strong></div>
                    <div class="table-cell-2">{{ county }}</div>
                </div>
                <div class="table-row">
                    <div class="table-cell"><strong>Name:</strong></div>
                    <div class="table-cell-2">{{ name }}</div>
                </div>
                <div class="table-row">
                    <div class="table-cell"><strong>Login Link:</strong></div>
                    <div class="table-cell-2"><a href="#">{{ loginLink }}</a></div>
                </div>
                <div class="table-row">
                    <div class="table-cell"><strong>Search Link:</strong></div>
                    <div class="table-cell-2"><a href="#">{{ searchLink }}</a></div>
                </div>
            </div>
        </div>
        </div>        
        <br><br>
        </div>
